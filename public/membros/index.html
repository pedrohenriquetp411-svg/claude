<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Área de Membros - Bolos Gelados Lucrativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --brown:#6b3a1e; --pink:#c2306f; --bg:#fdf6f1; --card:#fff; --muted:#7a6a62; --line:#eadfd8; --green1:#22c55e; --green2:#16a34a; --lock:#b9aaa2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Montserrat,system-ui,sans-serif; background:var(--bg); color:var(--brown); }
  header { background:linear-gradient(90deg,#fde3ea,#fdf0e6); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .logo { display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:18px; text-decoration:none; color:var(--brown); } .logo b { color:var(--pink); }
  .who { font-size:13px; display:flex; gap:12px; align-items:center; }
  .link { background:none; border:0; color:var(--pink); font:inherit; font-weight:600; cursor:pointer; padding:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; }
  h1 { font-size:20px; margin:0 0 6px; } p.sub { margin:0 0 16px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 6px; }
  input { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:15px; }
  input:focus { outline:2px solid var(--pink); border-color:transparent; }
  .btn { display:inline-block; width:100%; margin-top:18px; padding:14px; border:0; border-radius:10px; font:inherit; font-weight:700; color:#fff; cursor:pointer;
         background:linear-gradient(90deg,var(--green1),var(--green2)); text-align:center; text-decoration:none; }
  .error { color:#b00020; font-size:14px; margin-top:12px; min-height:1em; }
  #login { max-width:420px; margin:48px auto; padding:0 16px; }
  #app { display:none; max-width:1100px; margin:20px auto; padding:0 16px; }
  .progress { margin:0 0 18px; } .bar { height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:8px; }
  .bar span { display:block; height:100%; background:linear-gradient(90deg,var(--pink),#9b5fc0); width:0; transition:width .4s; }
  .layout { display:grid; grid-template-columns:320px 1fr; gap:20px; align-items:start; }
  @media (max-width:820px){ .layout { grid-template-columns:1fr; } }
  .modules { padding:8px; }
  .module { border-bottom:1px solid var(--line); } .module:last-child { border:0; }
  .module > button { width:100%; text-align:left; background:none; border:0; padding:14px 12px; font:inherit; font-weight:700; color:var(--brown); cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .module.locked > button { color:var(--lock); cursor:default; }
  .module small { display:block; font-weight:400; font-size:12px; color:var(--muted); margin-top:3px; }
  .lessons { list-style:none; margin:0; padding:0 0 10px; display:none; } .module.open .lessons { display:block; }
  .lessons button { width:100%; text-align:left; background:none; border:0; padding:9px 12px 9px 18px; font:inherit; font-size:14px; color:var(--brown); cursor:pointer; border-radius:8px; display:flex; gap:8px; }
  .lessons button:hover:not([disabled]) { background:#fbeef2; } .lessons button.active { background:#fbe1ea; font-weight:600; }
  .lessons button[disabled] { color:var(--lock); cursor:not-allowed; }
  .player .video { position:relative; padding-top:56.25%; background:#2a1a12; border-radius:12px; overflow:hidden; margin-bottom:16px; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .soon { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; text-align:center; padding:20px; }
  .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; } .actions .btn { width:auto; margin:0; padding:12px 18px; }
  .btn.alt { background:var(--brown); }
  .locked-box { text-align:center; padding:40px 20px; color:var(--muted); } .locked-box .big { color:var(--lock); margin-bottom:8px; }
  .ic { flex:none; vertical-align:middle; } .is-done { color:var(--green2); } .module.open .chev { transform:rotate(180deg); }
  .lessons button .ic { color:var(--pink); } .lessons button[disabled] .ic { color:var(--lock); }
  .module small .ic { vertical-align:-2px; } .soon { gap:10px; } .btn .ic { vertical-align:-4px; }

  #bonusWrap { margin-top:22px; }
  .upgrade { display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:16px; background:linear-gradient(120deg,#928dc2,#c9316e); color:#fff; border:0; }
  .upgrade b { color:#fff; } .upgrade .btn { width:auto; margin:0; background:#fff; color:var(--pink); font-weight:700; white-space:nowrap; }
  .bonus-h { font-size:20px; margin:0 0 12px; color:var(--brown); }
  .bonus { margin-bottom:16px; }
  .bonus h3 { margin:0 0 4px; font-size:18px; color:var(--pink); }
  .bonus-desc { margin:0 0 16px; color:var(--muted); font-size:14px; }
  .cardapio { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .cal { background:#fdf6f1; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .cal h4 { margin:0 0 4px; color:var(--brown); font-size:15px; }
  .cal p { margin:0 0 8px; color:var(--muted); font-size:13px; }
  .cal ul { margin:0; padding-left:18px; font-size:13.5px; } .cal li { margin-bottom:4px; }
  .cardapio .tips { grid-column:1/-1; background:#fbe9f0; border:1px solid #f0cbdc; border-radius:12px; padding:14px 16px; }
  .cardapio .tips b { color:var(--pink); } .cardapio .tips ul { margin:8px 0 0; padding-left:18px; font-size:14px; }
  .pgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pgrid label { display:block; font-size:13px; font-weight:600; color:var(--brown); }
  .pgrid input, .pgrid select { width:100%; margin-top:5px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font:inherit; font-size:15px; }
  .pout { margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pout > div { background:#fdf6f1; border:1px solid var(--line); border-radius:10px; padding:11px 14px; }
  .pout span { display:block; font-size:12px; color:var(--muted); } .pout b { font-size:20px; } .pout b.hi { color:var(--pink); }
  .labels-preview { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0; }
  .lbl { border:2px solid; border-radius:10px; overflow:hidden; background:#fff; }
  .lbl-top { color:#fff; font-weight:700; text-align:center; padding:6px; font-size:13px; }
  .lbl-body { padding:10px; text-align:center; } .lbl-body b { display:block; font-size:14px; color:#333; }
  .lbl-body span { display:block; font-size:11.5px; color:#777; margin:3px 0; } .lbl-body em { font-style:normal; font-size:11px; color:#999; }
  @media (max-width:620px) { .cardapio, .pgrid, .pout { grid-template-columns:1fr; } .labels-preview { grid-template-columns:1fr 1fr; } }
  @media print {
    body * { visibility:hidden; }
    .labels-preview, .labels-preview * { visibility:visible; }
    .labels-preview { position:absolute; inset:0; grid-template-columns:repeat(2,1fr); gap:14px; padding:20px; }
    .lbl { break-inside:avoid; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="/membros/"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--pink)"><path d="M4 21h16v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"/><path d="M4 16c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5"/><path d="M12 11V8"/><circle cx="12" cy="5.5" r="1"/></svg>Bolos <b>Gelados</b></a>
  <div class="who" id="who" hidden><span id="hello"></span><button class="link" id="logout">Sair</button></div>
</header>

<section id="login">
  <form class="card" id="loginForm">
    <h1>Área de Membros</h1>
    <p class="sub">Entre com o e-mail e a senha que você criou na compra.</p>
    <label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required>
    <label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrar</button>
    <div class="error" id="loginError" role="alert"></div>
    <p class="sub" style="margin-top:16px"><button type="button" class="link" id="showForgot">Esqueci minha senha</button></p>
    <p class="sub">Ainda não é aluna? <a href="/checkout/" style="color:var(--pink)">Garanta sua vaga</a>.</p>
  </form>
  <form class="card" id="forgotForm" hidden>
    <h1>Esqueci minha senha</h1>
    <p class="sub">Informe o e-mail da sua compra. Se ele estiver cadastrado, você recebe um link para criar uma nova senha.</p>
    <label for="forgotEmail">E-mail</label><input id="forgotEmail" type="email" autocomplete="email" required>
    <button class="btn" type="submit">Enviar link</button>
    <div class="error" id="forgotMsg" role="status"></div>
    <p class="sub" style="margin-top:16px"><button type="button" class="link" id="backToLogin">Voltar para o login</button></p>
  </form>
  <form class="card" id="resetForm" hidden>
    <h1>Criar nova senha</h1>
    <label for="newPassword">Nova senha</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Mínimo 6 caracteres" required>
    <label for="newPassword2">Confirme a nova senha</label><input id="newPassword2" type="password" autocomplete="new-password" required>
    <button class="btn" type="submit">Salvar e entrar</button>
    <div class="error" id="resetError" role="alert"></div>
  </form>
</section>

<section id="app">
  <div class="card progress"><b id="courseTitle"></b> · <span id="progressText"></span><div class="bar"><span id="progressBar"></span></div></div>
  <div id="upgradeBanner"></div>
  <div class="layout">
    <nav class="card modules" id="modules"></nav>
    <article class="card player" id="player"></article>
  </div>
  <div id="bonusWrap"></div>
</section>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = null, current = null;
  var fmtDate = function (iso) { return new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "long" }); };
  var ICON = {
    lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    play: '<circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z" fill="currentColor"/>',
    done: '<circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="m7.5 12.5 3 3 6-6.5" stroke="#fff"/>',
    chevron: '<path d="m6 9 6 6 6-6"/>',
    film: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h5M2 15h5M17 9h5M17 15h5"/>',
    undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7"/>'
  };
  var icon = function (name, size, cls) {
    return '<svg class="ic ' + (cls || "") + '" width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + "</svg>";
  };
  var esc = function (s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; };

  async function load() {
    var r = await fetch("/api/members/content", { cache: "no-store" });
    if (r.status === 401) { $("login").style.display = "block"; $("app").style.display = "none"; $("who").hidden = true; return; }
    state = await r.json();
    $("login").style.display = "none"; $("app").style.display = "block"; $("who").hidden = false;
    $("hello").textContent = "Olá, " + (state.member.name || "").split(" ")[0] + "!";
    render();
    renderBonuses(state.bonuses || []);
  }

  function renderBonuses(bonuses) {
    var wrap = $("bonusWrap");
    if (!bonuses.length) { wrap.innerHTML = ""; return; }
    var html = '<h2 class="bonus-h">Seus materiais extras</h2>';
    bonuses.forEach(function (b) {
      html += '<div class="card bonus"><h3>' + esc(b.title) + "</h3><p class='bonus-desc'>" + esc(b.desc) + "</p>";
      if (b.type === "content") html += renderCardapio(b);
      else if (b.tool === "pricing") html += '<div class="tool" data-tool="pricing"></div>';
      else if (b.tool === "labels") html += '<div class="tool" data-tool="labels"></div>';
      html += "</div>";
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll('.tool[data-tool="pricing"]').forEach(buildPricingTool);
    wrap.querySelectorAll('.tool[data-tool="labels"]').forEach(buildLabelsTool);
  }

  function renderCardapio(b) {
    var h = '<div class="cardapio">';
    (b.sections || []).forEach(function (s) {
      h += '<div class="cal"><h4>' + esc(s.h) + "</h4><p>" + esc(s.p) + "</p><ul>";
      (s.items || []).forEach(function (it) { h += "<li>" + esc(it) + "</li>"; });
      h += "</ul></div>";
    });
    if (b.tips && b.tips.length) {
      h += '<div class="tips"><b>Dicas de venda</b><ul>';
      b.tips.forEach(function (t) { h += "<li>" + esc(t) + "</li>"; });
      h += "</ul></div>";
    }
    return h + "</div>";
  }

  function buildPricingTool(el) {
    el.innerHTML =
      '<div class="pcalc">' +
      '<div class="pgrid">' +
      '<label>Custo dos ingredientes (por bolo)<input type="number" min="0" step="0.01" data-f="ing" placeholder="R$ 0,00"></label>' +
      '<label>Embalagem + rótulo<input type="number" min="0" step="0.01" data-f="emb" placeholder="R$ 0,00"></label>' +
      '<label>Gás, luz e outros (por bolo)<input type="number" min="0" step="0.01" data-f="fix" placeholder="R$ 0,00"></label>' +
      '<label>Seu tempo (por bolo)<input type="number" min="0" step="0.01" data-f="mao" placeholder="R$ 0,00"></label>' +
      '<label>Margem de lucro<select data-f="mar"><option value="0.5">50%</option><option value="0.8">80%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>' +
      '<label>Rende quantas fatias?<input type="number" min="1" step="1" data-f="fat" value="1"></label>' +
      "</div>" +
      '<div class="pout"><div><span>Custo total</span><b data-o="cost">R$ 0,00</b></div><div><span>Preço de venda sugerido</span><b data-o="price" class="hi">R$ 0,00</b></div><div><span>Preço por fatia</span><b data-o="slice">R$ 0,00</b></div><div><span>Lucro por bolo</span><b data-o="profit">R$ 0,00</b></div></div>' +
      "</div>";
    function num(f) { var v = parseFloat(el.querySelector('[data-f="' + f + '"]').value); return isNaN(v) ? 0 : v; }
    function calc() {
      var cost = num("ing") + num("emb") + num("fix") + num("mao");
      var price = cost * (1 + num("mar"));
      var fat = Math.max(1, Math.round(num("fat")) || 1);
      el.querySelector('[data-o="cost"]').textContent = money(cost);
      el.querySelector('[data-o="price"]').textContent = money(price);
      el.querySelector('[data-o="slice"]').textContent = money(price / fat);
      el.querySelector('[data-o="profit"]').textContent = money(price - cost);
    }
    el.querySelectorAll("input,select").forEach(function (i) { i.addEventListener("input", calc); });
    calc();
  }

  function money(v) { return "R$ " + Number(v || 0).toFixed(2).replace(".", ","); }

  function buildLabelsTool(el) {
    el.innerHTML =
      '<div class="lab">' +
      '<div class="pgrid">' +
      '<label>Nome da sua marca<input data-l="brand" maxlength="28" placeholder="Doces da Ana"></label>' +
      '<label>Sabor<input data-l="flavor" maxlength="34" placeholder="Bolo gelado de Ninho"></label>' +
      '<label>Validade<input data-l="valid" maxlength="24" placeholder="Consumir em 5 dias"></label>' +
      '<label>Contato / @<input data-l="contact" maxlength="30" placeholder="@docesdaana · (00) 90000-0000"></label>' +
      '<label>Cor<select data-l="color"><option value="#c2306f">Rosa</option><option value="#6b3a1e">Marrom</option><option value="#2db189">Verde</option><option value="#928dc2">Lilás</option></select></label>' +
      "</div>" +
      '<div class="labels-preview" data-preview></div>' +
      '<button type="button" class="btn alt" data-print>Imprimir / salvar em PDF</button>' +
      "</div>";
    function val(k) { return el.querySelector('[data-l="' + k + '"]').value; }
    function draw() {
      var color = val("color"), brand = esc(val("brand") || "Sua Marca"), flavor = esc(val("flavor") || "Sabor do bolo"),
        valid = esc(val("valid") || "Consumir em X dias"), contact = esc(val("contact") || "@seuperfil");
      var one = '<div class="lbl" style="border-color:' + color + '"><div class="lbl-top" style="background:' + color + '">' + brand + "</div>" +
        '<div class="lbl-body"><b>' + flavor + "</b><span>" + valid + "</span><em>" + contact + "</em></div></div>";
      el.querySelector("[data-preview]").innerHTML = new Array(6).fill(one).join("");
    }
    el.querySelectorAll("input,select").forEach(function (i) { i.addEventListener("input", draw); });
    el.querySelector("[data-print]").addEventListener("click", function () { window.print(); });
    draw();
  }

  function render() {
    $("courseTitle").textContent = state.course;
    var p = state.progress, pct = p.total ? Math.round(p.done / p.total * 100) : 0;
    $("progressText").textContent = p.done + " de " + p.total + " aulas concluídas (" + pct + "%)";
    $("progressBar").style.width = pct + "%";
    $("upgradeBanner").innerHTML = state.upgrade
      ? '<div class="card upgrade"><div><b>Você tem o acesso Básico.</b> Libere as fatias, slice cakes e clássicos (todas as 26 receitas) com o acesso Completo.</div><a class="btn" href="/checkout/?plano=completo_oferta">Liberar tudo por R$ 19,90</a></div>'
      : "";

    var nav = $("modules"); nav.innerHTML = "";
    state.modules.forEach(function (m) {
      var div = document.createElement("div");
      div.className = "module" + (m.unlocked ? "" : " locked") + (m.unlocked && (!current || current.module === m.id) ? " open" : "");
      var sub = m.unlocked ? m.lessons.filter(function (l) { return l.done; }).length + "/" + m.lessons.length + " aulas" : icon("lock", 12) + " " + esc(m.lockReason || "Bloqueado");
      div.innerHTML = "<button type='button'><span>" + esc(m.title) + "<small>" + sub + "</small></span><span>" + (m.unlocked ? icon("chevron", 18, "chev") : icon("lock", 18)) + "</span></button><ul class='lessons'></ul>";
      if (m.unlocked) div.firstChild.onclick = function () { div.classList.toggle("open"); };
      var ul = div.querySelector("ul");
      m.lessons.forEach(function (l) {
        var li = document.createElement("li"), b = document.createElement("button");
        b.type = "button"; b.disabled = !l.unlocked;
        b.innerHTML = "<span>" + (l.done ? icon("done", 18, "is-done") : l.unlocked ? icon("play", 18) : icon("lock", 16)) + "</span><span>" + esc(l.title) + "</span>";
        if (current && current.lesson === l.id) b.className = "active";
        if (l.unlocked) b.onclick = function () { open(m, l); };
        else if (l.lockReason) b.title = l.lockReason;
        li.appendChild(b); ul.appendChild(li);
      });
      nav.appendChild(div);
    });

    if (!current) {
      var first = null;
      state.modules.some(function (m) { return m.lessons.some(function (l) { if (l.unlocked && !l.done) { first = [m, l]; return true; } }); });
      if (!first) state.modules.some(function (m) { return m.lessons.some(function (l) { if (l.unlocked) { first = [m, l]; return true; } }); });
      if (first) open(first[0], first[1]); else $("player").innerHTML = "<div class='locked-box'><div class='big'>" + icon("lock", 44) + "</div>Seu conteúdo será liberado em breve.</div>";
    }
  }

  function open(m, l) {
    current = { module: m.id, lesson: l.id };
    var video = l.video
      ? "<div class='video'><iframe src='" + esc(l.video) + "' allow='autoplay; fullscreen; picture-in-picture' allowfullscreen></iframe></div>"
      : "<div class='video'><div class='soon'>" + icon("film", 28) + " Vídeo em breve</div></div>";
    $("player").innerHTML = video + "<small style='color:var(--muted)'>" + esc(m.title) + "</small><h1>" + esc(l.title) + "</h1>" +
            "<div class='actions'>" + "" +
      "<button class='btn' id='doneBtn' type='button'>" + (l.done ? icon("undo") + " Marcar como não concluída" : icon("check") + " Marcar como concluída") + "</button></div>";
    $("doneBtn").onclick = async function () {
      this.disabled = true;
      await fetch("/api/members/progress", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ lessonId: l.id, done: !l.done }) });
      var keep = current; await load(); current = keep;
      state.modules.forEach(function (mm) { mm.lessons.forEach(function (ll) { if (ll.id === keep.lesson) open(mm, ll); }); });
      render();
    };
    render();
    if (window.innerWidth < 820) $("player").scrollIntoView({ behavior: "smooth" });
  }

  $("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault(); $("loginError").textContent = "";
    var r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("email").value, password: $("password").value }) });
    if (!r.ok) { $("loginError").textContent = (await r.json()).error || "Não foi possível entrar."; return; }
    load();
  });
  $("logout").onclick = async function () { await fetch("/api/logout", { method: "POST" }); current = null; load(); };

  function showForm(id) { ["loginForm", "forgotForm", "resetForm"].forEach(function (f) { $(f).hidden = f !== id; }); }
  $("showForgot").onclick = function () { $("forgotEmail").value = $("email").value; $("forgotMsg").textContent = ""; showForm("forgotForm"); };
  $("backToLogin").onclick = function () { showForm("loginForm"); };
  $("forgotForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    await fetch("/api/password/forgot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("forgotEmail").value }) });
    $("forgotMsg").style.color = "var(--green2)";
    $("forgotMsg").textContent = "Se o e-mail estiver cadastrado, o link chega em alguns minutos. Confira também o spam.";
  });

  var resetToken = new URLSearchParams(location.search).get("reset");
  if (resetToken) showForm("resetForm");
  $("resetForm").addEventListener("submit", async function (e) {
    e.preventDefault(); $("resetError").textContent = "";
    if ($("newPassword").value.length < 6) { $("resetError").textContent = "A senha precisa ter pelo menos 6 caracteres."; return; }
    if ($("newPassword").value !== $("newPassword2").value) { $("resetError").textContent = "As senhas não conferem."; return; }
    var r = await fetch("/api/password/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: resetToken, password: $("newPassword").value }) });
    if (!r.ok) { $("resetError").textContent = (await r.json()).error || "Não foi possível salvar."; return; }
    history.replaceState(null, "", "/membros/"); showForm("loginForm"); load();
  });

  load();
})();
</script>
</body>
</html>
